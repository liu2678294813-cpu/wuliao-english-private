<!doctype html>
<html lang="zh-CN">
  <head>
    <script src="/vocabulary/pronunciation.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无聊英语 · 背词训练</title>
    <link rel="icon" href="/vocabulary/favicon.svg" type="image/svg+xml" />
    <script src="/vocabulary/vocabulary-bridge-adapter.js"></script>
    <script src="/vocabulary/embedded-vocabulary.js"></script>
    <link rel="stylesheet" href="/vocabulary/memorize.css?v=20260724" />
    <link rel="stylesheet" href="/vocabulary/wuliao-theme.css?v=20260715" />
    <link rel="stylesheet" href="/vocabulary/deep-sea-theme.css?v=20260801" />
    <link rel="stylesheet" href="/vocabulary/vocabulary-redesign.css?v=20260808" />
  </head>
  <body>
    <header class="topbar">
      <a class="back-link" href="/vocabulary/index.html#/lists">← 返回主页</a>
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">无</span>
        <div>
          <h1>无聊英语 · 背词训练</h1>
        </div>
      </div>
      <span id="accountLabel" class="account"></span>
    </header>

    <main class="page">
      <section class="controls">
        <div class="memory-list-controls">
          <h2>背诵</h2>
          <label>
            <span>选择词库</span>
            <select id="listSelect"></select>
          </label>
        </div>
        <div class="memory-controls-right">
          <div class="memory-mode-switches" aria-label="背词模式">
            <div role="group" aria-label="遮挡规则"><button data-memory-rule="default" type="button">默认</button><button data-memory-rule="cycle" type="button">循环</button></div>
            <div role="group" aria-label="操作方式"><button data-memory-input="click" type="button">点击</button><button data-memory-input="swipe" type="button">滑动</button></div>
          </div>
        <div class="actions">
          <button id="rangeButton" class="secondary" type="button" aria-pressed="false">区间全黑</button>
          <button id="undoButton" class="secondary" type="button" disabled>撤销上一步</button>
          <button id="clearButton" class="secondary" type="button">一键清除黑线</button>
        </div>
        </div>
      </section>

      <section id="rangePanel" class="range-panel hidden" aria-live="polite">
        <span id="rangeDescription">请选择起点</span>
        <div class="range-actions">
          <button id="rangeConfirm" type="button" disabled>确认全黑</button>
          <button id="rangeCancel" type="button">取消</button>
        </div>
      </section>

      <section class="status-row">
        <span id="listSummary">正在读取词库…</span>
        <span id="todaySummary">今日背词 0 个</span>
        <span id="maskSummary"></span>
      </section>

      <section id="viewport" class="word-viewport" aria-live="polite">
        <div id="spacer" class="spacer"></div>
        <div id="rowsLayer" class="rows-layer"></div>
      </section>

      <div id="message" class="message hidden"></div>
    </main>

    <script type="module" src="/vocabulary/memorize.js?v=20260728-full-flow"></script>
  </body>
</html>
